[package]
name = "nova-ordem-modpack-manager"
version = "0.2.0"
description = "Secure Minecraft modpack manager"
edition = "2021"

[lib]
name = "nova_ordem_modpack_manager_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
url = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
